# yaml-language-server: $schema=../schema/universe.schema.json
#
# The Lord of the Rings universe, books only. Names and short labels only: no quotes, no
# descriptions. French names follow the translation by Francis Ledoux (The Hobbit, The Lord
# of the Rings, 1972-1973, whose forms differ from his Hobbit of 1969) and by Pierre Alien
# (The Silmarillion); names that the French translations keep unchanged (Sindarin, Quenya,
# Khuzdul, Old English) are plain strings. French forms were checked against the
# correspondence tables of Tolkiendil (tolkiendil.com).
# Vocabularies (streets, inn signs, email domains) are invented for the generator.
format: 1

universe:
  id: lotr
  name: { en: The Lord of the Rings, fr: Le Seigneur des Anneaux }
  default_locale: en
  locales: [en, fr]
  sources:
    scope: "Books only: The Hobbit, The Lord of the Rings, The Silmarillion. No film-only elements."
    translations:
      fr: "Francis Ledoux; Pierre Alien for The Silmarillion"
  maintainers: [Kentrow]

generation:
  organization_generated_ratio: 0.5

place_levels:
  area: { en: Realm, fr: Royaume }
  subdivision: { en: Region, fr: Région }
  locality: { en: Town, fr: Ville }

places:
  # Areas
  - id: eriador
    level: area
    name: Eriador
    weight: 3
    patterns:
      postal_code: "ER-{digits:4}"
  - id: lindon
    level: area
    name: Lindon
    patterns:
      postal_code: "LI-{digits:4}"
  - id: rhovanion
    level: area
    name: Rhovanion
    weight: 2
    patterns:
      postal_code: "RH-{digits:4}"
