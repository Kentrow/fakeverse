    weight: 3
    patterns:
      postal_code: "GO-{digits:4}"
  - id: rohan
    level: area
    name: Rohan
    weight: 2
    patterns:
      postal_code: "RO-{digits:4}"
  - id: beleriand
    level: area
    name: Beleriand
    patterns:
