    en: "{int:1-999} {vocab.street_name} {vocab.street_type}"
    fr: "{int:1-999}, {vocab.street_type} {vocab.street_name}"
  postal_code: "GX-{digits:5}"
  address_format:
    en: "{street_address}\n{locality} {postal_code}\n{subdivision}, {area}"
    fr: "{street_address}\n{postal_code} {locality}\n{subdivision}, {area}"
  phone: "{digits:3}-{digits:3}-{digits:4}"
  email: "{first_name|slug}.{family_name|slug}@{vocab.email_domain}"
  username: "{first_name|slug}{int:1-9999}"
  organization_name: "{vocab.org_name}"

extensions:
  starship:
    label: { en: Starship, fr: Vaisseau }
    fields:
      name: { vocab: ship_name }
      model: { vocab: ship_model }
      registry: { pattern: "{letters:2}-{digits:4}" }
      homeworld: { place: subdivision }
      crew: { int: "1-12" }
      operator: { people: true }
