# yaml-language-server: $schema=../schema/universe.schema.json
#
# Star Wars universe, Disney canon only (2014 and later), no Legends. Names and short labels
# only: no quotes, no descriptions. Proper names that the French releases keep unchanged are
# plain strings. Names marked `canon: false` are invented to enrich the pools; vocabularies
# (streets, ship names, business names, email domains) are invented for the generator.
format: 1

universe:
  id: starwars
  name: Star Wars
  default_locale: en
  locales: [en, fr]
  sources:
    scope: "Disney canon only (2014 and later): films, series, novels, comics and games. No Legends."
    translations:
      fr: "Official French releases by Lucasfilm"
  maintainers: [Kentrow]

generation:
  organization_generated_ratio: 0.5

place_levels:
  area: { en: Region, fr: Région }
  subdivision: { en: Planet, fr: Planète }
  locality: { en: City, fr: Ville }

places:
  # Galactic regions
  - id: core-worlds
    level: area
    name: { en: Core Worlds, fr: Mondes du Noyau }
    weight: 2
    patterns:
      postal_code: "CW-{digits:5}"
  - id: inner-rim
    level: area
    name: { en: Inner Rim, fr: Bordure Intérieure }
    patterns:
      postal_code: "IR-{digits:5}"
  - id: mid-rim
    level: area
    name: { en: Mid Rim, fr: Bordure Médiane }
    patterns:
      postal_code: "MR-{digits:5}"
  - id: outer-rim
    level: area
    name: { en: Outer Rim, fr: Bordure Extérieure }
    weight: 3
    patterns:
      postal_code: "OR-{digits:5}"
  - id: wild-space
    level: area
    name: { en: Wild Space, fr: Espace Sauvage }
    patterns:
      postal_code: "WS-{digits:5}"

  # Core Worlds
  - id: coruscant
    level: subdivision
    parent: core-worlds
    name: Coruscant
    weight: 5
    patterns:
      street_address:
        en: "Level {int:1-5127}, {int:1-999} {vocab.street_name} {vocab.street_type}"
        fr: "{int:1-999}, {vocab.street_type} {vocab.street_name}, niveau {int:1-5127}"
