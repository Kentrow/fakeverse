# yaml-language-server: $schema=../schema/universe.schema.json
#
# Sherlock Holmes universe, the Canon by Arthur Conan Doyle only (4 novels and 56 short
# stories, 1887-1927). No pastiches, films or series. Names and short labels only: no quotes,
# no descriptions. Proper names that the French translation keeps unchanged are plain strings.
# Names marked `canon: false` are invented, or real places the Canon never mentions, to enrich
# the pools; vocabularies (streets, firm partners, exchanges, email domains) are invented.
format: 1

universe:
  id: sherlock
  name: Sherlock Holmes
  default_locale: en
  locales: [en, fr]
  sources:
    scope: "The Canon by Arthur Conan Doyle only: 4 novels and 56 short stories (1887-1927). No pastiches, films or series."
    translations:
      fr: "Bibliothèque de la Pléiade (Gallimard, 2025), edited by Alain Morvan"
  maintainers: [Kentrow]

generation:
  organization_generated_ratio: 0.5

place_levels:
  area: { en: Region, fr: Région }
  subdivision: { en: County, fr: Comté }
  locality: { en: Town, fr: Ville }

places:
  - id: southern-england
    level: area
    name: { en: Southern England, fr: Sud de l'Angleterre }
    weight: 6

  # London: one subdivision, its neighbourhoods are the localities. Each carries the
  # Victorian postal district of the neighbourhood.
  - id: london
    level: subdivision
    parent: southern-england
    name: { en: London, fr: Londres }
    weight: 10
    patterns:
      address_format: "{street_address}\n{locality}, {subdivision} {postal_code}"

