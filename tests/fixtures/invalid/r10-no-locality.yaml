# Rule 10: no locality (the homeland then has none either).
format: 1

universe:
  id: r10-no-locality
  name: { en: Minimal, fr: Minimal }
  default_locale: en
  locales: [en, fr]
  sources:
    scope: "Minimal valid universe for validation tests."
  maintainers: [Kentrow]

places:
  - id: land
    level: area
    name: { en: Land, fr: Terre }
  - id: county
    level: subdivision
    parent: land
    name: { en: County, fr: Canton }

peoples:
  - id: folk
    name: { en: Folk, fr: Peuple }
    homelands: [county]
    first_names: [Ann, Ben, Cid, Dan, Eve, Fay, Gus, Hal, Ivy, Jon]
    family_names: [Smith]

organizations:
  - id: guild
    name: { en: Guild, fr: Guilde }

vocab:
  street:
    - { en: Street, fr: rue }

patterns:
  street_address: { en: "{int:1-9} {vocab.street}", fr: "{int:1-9} {vocab.street}" }
  postal_code: "{digits:5}"
  phone: "{digits:10}"
  email: "{first_name|slug}@example.org"
  username: "{first_name|slug}{int:1-9}"
